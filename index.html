<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<title>Samuele Ancona | Coming soon</title>
<style>
:root {
  --background: #0b0d10;
  --text: #edf1f7;
  --muted: #919aa8;
  --accent: #79a8ff;
  --accent-soft: rgba(121, 168, 255, 0.12);
  --line: rgba(237, 241, 247, 0.13);
  --sans: "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--background); }

body {
  display: grid;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  place-items: center;
  padding: 2rem 1.25rem;
  color: var(--text);
  background:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
    var(--background);
  background-size: 4rem 4rem;
  font-family: var(--sans);
  line-height: 1.65;
  text-align: center;
  text-rendering: optimizeLegibility;
}

main { width: min(100%, 44rem); }

.label {
  margin: 0 0 2rem;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(3rem, 12vw, 6rem);
  font-weight: 650;
  letter-spacing: -0.05em;
  line-height: 1;
}

.soon {
  margin: 1.75rem 0 0;
  color: var(--text);
  font-size: clamp(1.15rem, 3.5vw, 1.5rem);
}

.de {
  margin: 0.5rem 0 0;
  color: var(--muted);
  font-size: 1rem;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
  margin: 3rem 0 0;
  padding: 0.55rem 1rem;
  border: 1px solid var(--line);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.dot {
  width: 0.45rem;
  height: 0.45rem;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 0.3rem var(--accent-soft);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0.3rem var(--accent-soft); }
  50% { opacity: 0.45; box-shadow: 0 0 0 0.6rem rgba(121, 168, 255, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .dot { animation: none; }
}
</style>
</head>
<body>
<main>
  <p class="label">Switzerland · Student &amp; developer</p>
  <h1>Samuele Ancona</h1>
  <p class="soon">Portfolio coming soon</p>
  <p class="de">Die Seite wird gerade überarbeitet. Bis bald.</p>
  <p class="status" role="status"><span class="dot" aria-hidden="true"></span> Under construction</p>
</main>
</body>
</html>
